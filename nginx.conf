server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源带 hash，可长期缓存
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证新版本即时生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 首页单独写死，不走下面的目录探测，语义最清楚
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # 路由回退：优先命中 prerender 生成的 /a/<slug>/index.html（带专属 OG）。
    # 命不中说明这个地址真的不存在——回 404 状态码，响应体仍然是 SPA 壳，
    # 前端路由会渲染 404 页。别改回 /index.html 当兜底：那会让所有拼错的
    # 地址都返回 200，搜索引擎按「正常页面」把它们收录进去。
    # 也别把 $uri/index.html 改回 $uri/——那会 301 跳到带斜杠的 URL。
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # 404 的响应体用 SPA 壳：状态码保持 404，页面照样能渲染出来。
    error_page 404 /index.html;
}
